name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Validate + full local suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check (every shell script)
        run: |
          set -e
          for f in $(find . -type f \( -name '*.sh' -o -path './bin/*' -o -path './scripts/*' -o -path './test/mocks/bin/*' \)); do
            if head -1 "$f" | grep -qE '^#!.*bash'; then
              bash -n "$f"
            fi
          done

      - name: shellcheck (error severity)
        run: |
          set -e
          for f in $(find . -type f \( -name '*.sh' -o -path './bin/*' \)); do
            if head -1 "$f" | grep -q '^#!.*bash'; then
              shellcheck -x -S error "$f"
            fi
          done

      - name: Project validation
        run: ./bootstrap.sh --validate

      - name: Run full local test suite
        run: bash test/run_all.sh local

      - name: Fail on any test failure
        run: |
          REPORT=test/results/final-report.txt
          if [[ ! -f "$REPORT" ]]; then
            echo "::error::final-report.txt missing — suite did not complete"
            exit 1
          fi
          if grep -qE '^  FAIL: [1-9]' "$REPORT"; then
            echo "::error::Test failures found:"
            grep -E '^  (PASS|FAIL|SKIP):' "$REPORT"
            exit 1
          fi
          echo "All local checks passed:"
          grep -E '^  (PASS|FAIL|SKIP):' "$REPORT" | head -4

  windows:
    name: Windows client (PowerShell parse + structure)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse every .ps1 with the real PowerShell parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          if ($files.Count -eq 0) { throw "no .ps1 files found" }
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error::parse errors in $($f.Name):"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed++
            } else {
              Write-Host "OK $($f.Name)"
            }
          }
          exit ([int]($failed -gt 0))

      - name: Structural checks (bootstrap --validate subset)
        shell: bash
        run: |
          set -e
          # Every Windows command documented in the README exists
          for f in bootstrap.ps1 bin/grk-client-lib.ps1 bin/gpu-status.ps1 \
                   bin/gpu-test.ps1 bin/model-list.ps1 bin/model-download.ps1 \
                   bin/model-run.ps1 bin/model-stop.ps1 bin/ai-start.ps1 \
                   bin/ai-stop.ps1 bin/ai-info.ps1 bin/ai-doctor.ps1 \
                   bin/api-status.ps1 bin/ai-backup.ps1; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          # Honest remote wording: no .ps1 may claim to PERFORM a local GPU
          # inspection (comments that state Windows has no local GPU path are fine,
          # so exclude comment lines before matching)
          if grep -rilE '^[^#]*local (nvidia|gpu)' bin/*.ps1 bootstrap.ps1; then
            echo "::error::.ps1 file claims a local GPU check"
            exit 1
          fi
          echo "Windows client structure OK: all documented .ps1 files present"

      - name: Run a real client command end-to-end (help path only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./bin/api-status.ps1 -Help
          # Without a configured remote this is EXPECTED to exit non-zero;
          # what must not happen is a parse/runtime crash before the config check.
          pwsh -NoProfile -File ./bin/ai-doctor.ps1
          Write-Host "ai-doctor.ps1 executed (remote-not-configured exit code: $LASTEXITCODE — expected)."
          exit 0

