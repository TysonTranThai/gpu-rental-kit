# =============================================================================
# GPU Rental Kit — Model Registry / Aliases
# =============================================================================
# Define shortcut aliases for commonly used models.
# Each entry maps a friendly name to a full model identifier.
#
# Format:
#   alias:
#     source: huggingface | ollama | custom
#     name: "org/repo" or full path
#     backend: ollama | vllm | llamacpp | auto
#     min_vram_gb: <integer>  # informational
#     notes: "brief description"
#
# Refreshed 2026-09: current-generation families (Qwen3, Gemma 3, Llama 3.3,
# DeepSeek-R1) verified against ollama.com/library and Hugging Face repos.
# GGUF entries point at actively maintained quantizers (bartowski) instead of
# the legacy TheBloke mirrors.
# =============================================================================

models:

  # --- Small models (<12GB VRAM) ---
  qwen3-8b:
    source: ollama
    name: "qwen3:8b"
    backend: ollama
    min_vram_gb: 6
    notes: "Qwen3 8B — current-gen default; thinking + tools"

  gemma3-4b:
    source: ollama
    name: "gemma3:4b"
    backend: ollama
    min_vram_gb: 4
    notes: "Gemma 3 4B — vision + 128K context, runs on almost anything"

  deepseek-r1-8b:
    source: ollama
    name: "deepseek-r1:8b"
    backend: ollama
    min_vram_gb: 6
    notes: "DeepSeek-R1 8B distill — reasoning on a small GPU"

  llama3.1-8b:
    source: ollama
    name: "llama3.1:8b"
    backend: ollama
    min_vram_gb: 10
    notes: "Meta Llama 3.1 8B — classic reliable choice"

  qwen3-8b-fp8:
    source: huggingface
    name: "Qwen/Qwen3-8B-FP8"
    backend: vllm
    min_vram_gb: 10
    notes: "Qwen3 8B official FP8 for vLLM (Ada/Hopper+ GPUs)"

  # --- Medium models (16-23GB VRAM) ---
  qwen3-14b:
    source: ollama
    name: "qwen3:14b"
    backend: ollama
    min_vram_gb: 12
    notes: "Qwen3 14B — strong mid-size all-rounder"

  gemma3-12b:
    source: ollama
    name: "gemma3:12b"
    backend: ollama
    min_vram_gb: 10
    notes: "Gemma 3 12B — vision + 128K context"

  deepseek-r1-14b:
    source: ollama
    name: "deepseek-r1:14b"
    backend: ollama
    min_vram_gb: 12
    notes: "DeepSeek-R1 14B distill — reasoning"

  qwen3-32b-awq:
    source: huggingface
    name: "Qwen/Qwen3-32B-AWQ"
    backend: vllm
    min_vram_gb: 20
    notes: "Qwen3 32B 4-bit AWQ — fits a 24GB GPU via vLLM"

  # --- Large models (24-31GB VRAM) ---
  qwen3-30b-a3b:
    source: ollama
    name: "qwen3:30b"
    backend: ollama
    min_vram_gb: 20
    notes: "Qwen3 30B-A3B MoE — only ~3B params active, fast on one 24GB GPU"

  qwen3-coder-30b:
    source: ollama
    name: "qwen3-coder:30b"
    backend: ollama
    min_vram_gb: 20
    notes: "Qwen3 Coder 30B-A3B MoE — coding specialist"

  deepseek-r1-32b:
    source: ollama
    name: "deepseek-r1:32b"
    backend: ollama
    min_vram_gb: 22
    notes: "DeepSeek-R1 32B distill — heavy reasoning on one 24GB GPU"

  # --- Very large models (32GB+ VRAM) ---
  llama3-70b:
    source: huggingface
    name: "hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4"
    backend: vllm
    min_vram_gb: 40
    notes: "Llama 3.1 70B 4-bit AWQ — needs 40GB+ (multi-GPU sharding)"

  llama3.3-70b:
    source: ollama
    name: "llama3.3:70b"
    backend: ollama
    min_vram_gb: 46
    notes: "Llama 3.3 70B — 3.1-405B-class quality; shard across GPUs"

  llama3.3-70b-awq:
    source: huggingface
    name: "casperhansen/llama-3.3-70b-instruct-awq"
    backend: vllm
    min_vram_gb: 40
    notes: "Llama 3.3 70B 4-bit AWQ for vLLM — needs 40GB+"

  # --- GGUF models (for llama.cpp) ---
  qwen3-8b-gguf:
    source: huggingface
    name: "bartowski/Qwen_Qwen3-8B-GGUF"
    file: "Qwen3-8B-Q4_K_M.gguf"
    backend: llamacpp
    min_vram_gb: 6
    notes: "Qwen3 8B GGUF Q4_K_M (single file, maintained quant)"

  gemma3-12b-gguf:
    source: huggingface
    name: "bartowski/google_gemma-3-12b-it-GGUF"
    file: "google_gemma-3-12b-it-Q4_K_M.gguf"
    backend: llamacpp
    min_vram_gb: 9
    notes: "Gemma 3 12B GGUF Q4_K_M (single file)"

  llama3-8b-gguf:
    source: huggingface
    name: "bartowski/Meta-Llama-3-8B-Instruct-GGUF"
    file: "Meta-Llama-3-8B-Instruct-Q4_K_M.gguf"
    backend: llamacpp
    min_vram_gb: 6
    notes: "Llama 3 8B GGUF Q4_K_M (single file, maintained quant)"

  mistral-7b-gguf:
    source: huggingface
    name: "bartowski/Mistral-7B-Instruct-v0.2-GGUF"
    file: "Mistral-7B-Instruct-v0.2-Q4_K_M.gguf"
    backend: llamacpp
    min_vram_gb: 6
    notes: "Mistral 7B GGUF Q4_K_M (single file, maintained quant)"
